<div class="login-container">
  <h1>Login</h1>
  <p>Select your role to continue:</p>

  <div class="login-cards">
    <!-- Admin Card -->
    <div class="login-card">
      <h3>👤 Admin</h3>
      <p>Access admin dashboard and manage system.</p>
      <button routerLink="admin" routerLinkActive="active">Admin Login</button>
    </div>

    <!-- Customer Card -->
    <div class="login-card">
      <h3>🛒 Customer</h3>
      <p>Shop fruits and manage your orders.</p>
      <button routerLink="customer" routerLinkActive="active">Customer Login</button>
    </div>

    <!-- Supplier Card -->
    <div class="login-card">
      <h3>📦 Supplier</h3>
      <p>Manage fruit supply and deliveries.</p>
      <button routerLink="supplier" routerLinkActive="active">Supplier Login</button>
    </div>
  </div>
</div>
