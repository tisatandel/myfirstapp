<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Fruit Basket - Contact Us</title>
  <link rel="stylesheet" href="contact.css" />
</head>
<body>
  <section class="contact">
    <h1>Contact Us</h1>
    <p>We’d love to hear from you! Below you’ll find our details and a form to reach us.</p>

    <!-- Website Details -->
    <div class="website-details">
      <h2 class="center-logo">{{siteName}}</h2>
      <p>{{siteDescription}}</p>
      <ul>
        <li>📍 <strong>Address:</strong> {{address}}</li>
        <li>📞 <strong>Phone:</strong> {{phone}}</li>
        <li>📧 <strong>Email:</strong> {{email}}</li>
      </ul>
    </div>

    <!-- Contact Form -->
    <form class="contact-form">
      <label for="name">Name</label>
      <input type="text" id="name" placeholder="Enter your name" required>

      <label for="email">Email</label>
      <input type="email" id="email" placeholder="Enter your email" required>

      <label for="message">Message</label>
      <textarea id="message" rows="5" placeholder="Write your message..." required></textarea>
      <button type="submit">Send Message</button>
      
    </form>
  </section>
</body>
<img [src]="ImageUrl" alt="Fruit Basket logo" style="width: 200px; height: 200px;">
  <label for="name">Name</label>
  <input type="text" id="name" [(ngModel)]="name" name="name" placeholder="Enter your name" required>
  <p>{{name}}</p>
  <h2>{{emailInput()}}</h2>
  
</html>
