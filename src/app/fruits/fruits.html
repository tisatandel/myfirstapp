<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Fruit Basket - Fruits</title>
  <link rel="stylesheet" href="fruits.css" />
</head>
<body>
  <section class="fruits">
    <h1>Our Fresh Fruits</h1>
    <div class="fruit-grid">
      <div class="fruit-card">
        <img src="images/ap.jpg" alt="Apple">
        <h3>Apple</h3>
        <p>₹120/kg</p>
      </div>
      <div class="fruit-card">
        <img src="images/m1.jpg" alt="Mango">
        <h3>Mango</h3>
        <p>₹150/kg</p>
      </div>
      <div class="fruit-card">
        <img src="images/cherry.jpg" alt="Cherry">
        <h3>Cherry</h3>
        <p>₹425/kg</p>
      </div>
      <div class="fruit-card">
        <img src="images/o1.jpg" alt="Orange">
        <h3>Orange</h3>
        <p>₹80/kg</p>
      </div>
    </div>
  </section>
</body>
</html>
