<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Fruit Basket - Main</title>
  <link rel="stylesheet" href="main.css" />
</head>
<body>
  <main>
    <section class="hero">
      <h1>Fresh Fruits Delivered to Your Door</h1>
      <p>Explore our wide range of seasonal and exotic fruits. 100% organic and farm-fresh!</p>
      <button>Shop Now</button>
    </section>

    <section class="fruit-grid">
      <div class="fruit-card">
        <img src="images/apple.jpg" alt="Apple" />
        <h3>Apple</h3>
        <p>₹120/kg</p>
      </div>
      <div class="fruit-card">
        <img src="images/mango.jpg" alt="Mango" />
        <h3>Mango</h3>
        <p>₹150/kg</p>
      </div>
      <div class="fruit-card">
        <img src="images/banana.jpg" alt="Banana" />
        <h3>Banana</h3>
        <p>₹40/dozen</p>
      </div>
    </section>
  </main>
</body>
</html>
